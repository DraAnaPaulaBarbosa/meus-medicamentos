function fixMed(m){

    doseText:(m.doseText!==undefined?String(m.doseText):String(m.dose||"")),times:times,
    days:Array.isArray(m.days)?m.days.filter(function(x){return x>=0&&x<=6;}):[],start:String(m.start||""),dur:parseInt(m.dur,10)||0,
    prn:!!m.prn,purpose:Array.isArray(m.purpose)?m.purpose.map(String):[],stockOn:!!m.stockOn,stock:+m.stock||0,limit:(m.limit!==undefined&&m.limit!==null?+m.limit:10)};
}
function fixPlan(p){
  return {id:String(p.id||uid()),kind:(["measure","activity","mood"].indexOf(p.kind)>=0?p.kind:"activity"),type:String(p.type||""),name:String(p.name||""),
    times:Array.isArray(p.times)?p.times.map(String):[],days:Array.isArray(p.days)?p.days.filter(function(x){return x>=0&&x<=6;}):[],start:String(p.start||""),dur:parseInt(p.dur,10)||0};
}
function migrate(o){
  var s=blank();if(!o||typeof o!=="object")return s;
  s.name=String(o.name||"");
  s.meds=(Array.isArray(o.meds)?o.meds:[]).map(fixMed);
  s.plans=(Array.isArray(o.plans)?o.plans:[]).map(fixPlan);
  s.logs=Array.isArray(o.logs)?o.logs:[];
  s.records=Array.isArray(o.records)?o.records:[];
  s.moods=(o.moods&&typeof o.moods==="object")?o.moods:{};
  s.prn=Array.isArray(o.prn)?o.prn:[];
  s.goals=(o.goals&&typeof o.goals==="object")?o.goals:{};
  s.hideTip=!!o.hideTip;s.alarmsOn=!!o.alarmsOn;s.snooze=(o.snooze&&typeof o.snooze==="object")?o.snooze:{};
  var oc=(o.checks&&typeof o.checks==="object")?o.checks:{};
  if(!o.v||o.v<2){
    var nc={};
    Object.keys(oc).forEach(function(k){
      var p=k.split("|");
      if(p.length===2){var md=null;s.meds.forEach(function(m){if(m.id===p[1])md=m;});nc[p[0]+"|"+p[1]+"|"+((md&&md.times[0])||"")]=1;}
      else nc[k]=oc[k];
    });
    s.checks=nc;s.onboarded=s.meds.length>0;
  }else{s.checks=oc;s.onboarded=!!o.onboarded;}
  return s;
}

/* ===== agenda ===== */
function dueOn(it,d){
  if(it.days&&it.days.length&&it.days.indexOf(d.getDay())<0)return false;
  if(it.start){var s=pd(it.start);if(d<s)return false;if(it.dur>0&&d>addD(s,it.dur-1))return false;}
  return true;
}
function findItem(id){
  var r=null;S.meds.forEach(function(m){if(m.id===id)r=m;});
  if(!r)S.plans.forEach(function(p){if(p.id===id)r=p;});
  return r;
}
function slotsOn(d){
  var ds=iso(d),out=[];
  S.meds.forEach(function(m){
    if(m.prn||!dueOn(m,d))return;
    (m.times.length?m.times:[""]).forEach(function(t){out.push({key:ds+"|"+m.id+"|"+t,kind:"med",it:m,time:t,date:ds});});
  });
  S.plans.forEach(function(p){
    if(!dueOn(p,d))return;
    (p.times.length?p.times:[""]).forEach(function(t){out.push({key:ds+"|"+p.id+"|"+t,kind:p.kind,it:p,time:t,date:ds});});
  });
  out.sort(function(a,b){return tkey(a.time)<tkey(b.time)?-1:tkey(a.time)>tkey(b.time)?1:(a.it.name||"").localeCompare(b.it.name||"");});
  return out;
}
function slotByKey(k){
  var p=k.split("|"),it=findItem(p[1]);if(!it)return null;
  return {key:k,kind:it.kind||"med",it:it,time:p.slice(2).join("|"),date:p[0]};
}
function st(k){return S.checks[k]||0;}
function qtyText(m){
  var q=(m.qty%1===0)?m.qty:String(m.qty).replace(".",",");
  return q+" "+m.unit;
}
function medSub(m){var a=[qtyText(m)];if(m.doseText)a.push(m.doseText);return a.join(" · ");}
function daysText(it){
  if(!it.days||!it.days.length||it.days.length===7)return "Diariamente";
  return it.days.slice().sort().map(function(i){return DAYS[i];}).join(", ");
}
function schedText(it){
  var a=[];
  if(it.prn)return "Quando necessário";
  a.push(daysText(it));
  var ts=(it.times||[]).filter(Boolean);
  a.push(ts.length?ts.join(" · "):"Qualquer hora");
  var t=a.join(" — ");
  if(it.dur>0&&it.start){t+=" · até "+fmtDM(addD(pd(it.start),it.dur-1));}
  return t;
}
/* estoque */
function perDay(m){if(m.prn)return 0;var n=Math.max(1,m.times.length),dd=(m.days&&m.days.length)?m.days.length:7;return m.qty*n*dd/7;}
function daysLeft(m){var p=perDay(m);return p>0?Math.floor(m.stock/p):null;}
function lowStock(m){return m.stockOn&&m.stock<=m.limit;}
function stockText(m){var s=(m.stock%1===0?m.stock:String(m.stock).replace(".",","));return s+" "+m.unit+" restante"+(m.stock===1?"":"s");}
function setStatus(sl,val){
  var old=st(sl.key);if(old===val)val=0;
  if(val)S.checks[sl.key]=val;else delete S.checks[sl.key];
  if(sl.kind==="med"){var m=sl.it;if(m.stockOn){
    if(old===1&&val!==1)m.stock=r2(m.stock+m.qty);
    if(val===1&&old!==1)m.stock=Math.max(0,r2(m.stock-m.qty));}}
  save();
  return val;
}
function dayStats(d){
  var sl=slotsOn(d),tk=0,sk=0;
  sl.forEach(function(s){var v=st(s.key);if(v===1)tk++;else if(v===2)sk++;});
  return {tot:sl.length,tk:tk,sk:sk};
}
function streak(){
  var n=0,t=today();
  for(var i=0;i<400;i++){
    var s=dayStats(addD(t,-i));
    if(!s.tot)continue;
    if(s.tk===s.tot)n++;else if(i>0)break;else continue;
  }
  return n;
}

function spark(vals,vals2,goal){
  var all=vals.concat(vals2||[]);if(goal!=null)all.push(goal);
  var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);if(mn===mx){mn-=1;mx+=1;}

  function X(i,n){return n<2?W/2:px+i*(W-2*px)/(n-1);}

function sugHtml(q){

  a.concat(b).slice(0,6).forEach(function(m){
    var fs=FORMS[norm(m)]||FORMS[m.toLowerCase()]||[];
    if(!fs.length){h+='<button data-a="wpick" data-v="'+esc(m)+'">'+esc(m)+IC.chev+'</button>';return;}
    fs.forEach(function(f){h+='<button data-a="wpick" data-v="'+esc(m+" "+f)+'">'+esc(m+" "+f)+IC.chev+'</button>';});

var CHAT_INSTR="Você é um assistente de informação sobre medicamentos dentro de um aplicativo de lembretes. Responda em português do Brasil, em linguagem simples, com no máximo 6 frases. Dê informação geral e educativa. Não faça diagnóstico, não prescreva e não mande mudar, parar ou dobrar doses: nesses casos diga para falar com o médico ou farmacêutico. Para dose esquecida, explique que depende do medicamento e oriente consultar a bula ou o farmacêutico. Se houver sinais de emergência (falta de ar, inchaço no rosto, desmaio, dor forte no peito, convulsão, suspeita de intoxicação), oriente ligar 192 (SAMU) ou procurar um pronto atendimento. Se não tiver certeza, diga que não sabe. Você é uma IA: lembre isso quando falar de segurança.";

function aiErr(e){
  var c=e&&e.code;
  return c==="not_granted"?"Você não permitiu o envio ao Claude. Recarregue a página e aceite para usar este recurso."
   :c==="rate_limited"?"Muitas tentativas seguidas. Aguarde um minuto."
   :(c==="images_unavailable"||c==="unavailable")?"Este recurso não está disponível neste ambiente."
   :"Não consegui concluir. Tente de novo.";
}
async function aiSample(){if(!window.claude)return null;try{return await claude.use("sample");}catch(e){return null;}}
function toB64(b){return new Promise(function(ok,no){var fr=new FileReader();fr.onload=function(){ok(String(fr.result).split(",")[1]);};fr.onerror=no;fr.readAsDataURL(b);});}
async function shrink(f){
  try{
    var bm=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement("canvas");
    c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    var bl=await new Promise(function(ok){c.toBlob(ok,"image/jpeg",0.85);});return bl||f;
  }catch(e){return f;}
}
async function aiJson(prompt,blob){
  var s=await aiSample();
  if(s){var lim=await s.limits().catch(function(){return null;});if(!lim||!lim.images)throw {code:"images_unavailable"};return await s.json(prompt,{images:[blob],cache:false});}
  if(window.API_URL){var r=await fetch(window.API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:await toB64(blob),media_type:blob.type||"image/jpeg"})});if(!r.ok)throw {code:"http"};return await r.json();}
  throw {code:"unavailable"};
}
async function aiChat(turns,ctx){
  var s=await aiSample(),last=turns.length-1;
  if(s){var arr=turns.map(function(t,i){return {role:t.role,content:i===last?CHAT_INSTR+(ctx?"\n\n"+ctx:"")+"\n\nMensagem da pessoa: "+t.content:t.content};});var r=await s(arr,{cache:false});return r.text;}
  if(window.API_URL){var x=await fetch(window.API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:turns,context:ctx||""})});if(!x.ok)throw {code:"http"};var j=await x.json();return j.text;}
  throw {code:"unavailable"};
}

function icsEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");}

function buildIcs(){
  var BD=["SU","MO","TU","WE","TH","FR","SA"],L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Meus Medicamentos//PT-BR//","CALSCALE:GREGORIAN","METHOD:PUBLISH"],n=0,stamp=icsD(new Date())+"T000000Z";
  remItems().forEach(function(x){
    var it=x.it,hm=x.t.split(":"),T=pad(+hm[0])+pad(+hm[1])+"00",start=it.start?pd(it.start):today(),first=null,cnt=0,i;
    for(i=0;i<800;i++){var d=addD(start,i);if(it.dur>0&&i>=it.dur)break;if(it.days&&it.days.length&&it.days.indexOf(d.getDay())<0)continue;if(!first)first=d;cnt++;}
    if(!first)return;
    var rr=(it.days&&it.days.length&&it.days.length<7)?"FREQ=WEEKLY;BYDAY="+it.days.map(function(q){return BD[q];}).join(","):"FREQ=DAILY";
    if(it.dur>0)rr+=";COUNT="+cnt;
    L.push("BEGIN:VEVENT","UID:"+it.id+"-"+x.t.replace(":","")+"@meusmedicamentos","DTSTAMP:"+stamp,"DTSTART:"+icsD(first)+"T"+T,"DTEND:"+icsD(first)+"T"+pad(+hm[0])+pad(Math.min(59,+hm[1]+15))+"00","RRULE:"+rr,icsFold("SUMMARY:"+icsEsc(x.title+" - "+x.body)),"BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:PT0S","DESCRIPTION:"+icsEsc(x.title),"END:VALARM","END:VEVENT");
    n++;
  });
  L.push("END:VCALENDAR");return {text:L.join("\r\n")+"\r\n",n:n};
}

/* ---- marcação rápida (atalho / botões da notificação) ---- */

}
function addMin(hm,m){var p=hm.split(":"),t=(+p[0])*60+(+p[1])+m;if(t>=1440)return "23:59";return pad(Math.floor(t/60))+":"+pad(t%60);}

function quickMark(k,v){
  var sl=slotByKey(k);if(!sl)return false;
  var cur=st(k);if(cur===v)return true;

}

/* ===== eventos e inicialização ===== */
function allDone(){var s=dayStats(today());return s.tot>0&&s.tk===s.tot;}
function toggleSlot(k){
  var sl=slotByKey(k);if(!sl)return;
  if(pd(sl.date)>today())return;
  if(sl.kind==="measure"){measSheet(sl.it.type,k);return;}
  if(sl.kind==="mood"){moodSheet(sl.date,k);return;}
  var was=allDone(),v=setStatus(sl,1);render();
  if(v===1){buzz();var b=$('.dot[data-k="'+k.replace(/"/g,'\\"')+'"]');if(b)b.classList.add("pop");if(!was&&allDone()&&sl.date===iso(today()))toast("Tudo certo por hoje!");}
}
function delEntry(id){
  var p=id.split(":"),t=p[0],key=p.slice(1).join(":");

    if(t==="rec")S.records=S.records.filter(function(r){return r.id!==key;});
    else if(t==="mood")delete S.moods[key];
    else if(t==="log")S.logs=S.logs.filter(function(l){return l.id!==key;});
    else if(t==="prn"){var pr=S.prn.filter(function(x){return x.id===key;})[0];S.prn=S.prn.filter(function(x){return x.id!==key;});var m=pr&&findItem(pr.med);if(m&&m.stockOn)m.stock=r2(m.stock+m.qty);}

  case "msym":{var sy=SYMS[+v],ix=moodSym.indexOf(sy);if(ix>=0)moodSym.splice(ix,1);else moodSym.push(sy);el.classList.toggle("on",ix<0);break;}
  case "mdsave":{if(!moodSel){toast("Escolha como você está.");break;}S.moods[v]={m:moodSel,sym:moodSym.slice(),note:$("#mdn").value.trim()};
    if(curK){var sm=slotByKey(curK);if(sm&&st(curK)!==1)setStatus(sm,1);curK=null;}
